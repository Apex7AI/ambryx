server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # URLs amigaveis: /shopping e /imobiliarias servem as paginas .html
    # sem redirecionar para a home (o fallback /index.html so vale para o resto).
    location = /shopping {
        try_files /shopping.html =404;
    }

    location = /imobiliarias {
        try_files /imobiliarias.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
